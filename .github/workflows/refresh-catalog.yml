name: Refresh catalog snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-catalog.yml"
      - "refresh-catalog.mjs"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node refresh-catalog.mjs
      - name: Commit refreshed snapshot
        run: |
          if [ -z "$(git status --porcelain -- catalog-data.js)" ]; then
            echo "Catalog snapshot is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js
          git commit -m "Refresh catalog snapshot"
          git pull --rebase origin main
          git push
